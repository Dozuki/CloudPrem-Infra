name: Azure release bundle

on:
  push:
    tags:
      - "azure-v*"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version_file: azure-config/.opentofu-version
          tofu_wrapper: false

      - name: Assemble bundle
        run: azure-config/scripts/assemble-release.sh "${GITHUB_REF_NAME#azure-}"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
