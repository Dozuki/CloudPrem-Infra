name: Azure release bundle

on:
  push:
    tags:
      - "azure-v*"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version_file: azure-config/.opentofu-version
          tofu_wrapper: false

      - name: Assemble bundle
        run: azure-config/scripts/assemble-release.sh "${GITHUB_REF_NAME#azure-}"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
