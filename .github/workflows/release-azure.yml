name: Azure release bundle

on:
  push:
    tags:
      - "azure-v*"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version_file: azure-config/.opentofu-version
          tofu_wrapper: false

      - name: Assemble bundle
        run: azure-config/scripts/assemble-release.sh "${GITHUB_REF_NAME#azure-}"

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
