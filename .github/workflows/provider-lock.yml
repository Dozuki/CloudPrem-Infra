name: 'Provider lock'

# The committed .terraform.lock.hcl is what stops a bad provider release from reaching
# the fleet on its own (aws 6.57.0, 2026-07-29). That protection has one failure mode
# worse than the problem it solves: a lock file whose hashes do not cover the platform
# the runner uses. Spacelift is linux_amd64; a lock file generated by a plain local
# `init` on a Mac carries darwin hashes only, and every stack then fails to init. That
# turns a provider bug into a fleet-wide inability to run anything.
#
# The hashes in the file are not labelled by platform, so you cannot check coverage by
# reading it. The only honest test is to ask tofu to complete the lock for the
# platforms we care about and confirm it had nothing to add. Renovate maintains this
# file once it starts proposing bumps and its platform handling is not ours to control,
# so this asserts the property rather than trusting the tool.

on:
  pull_request:
    paths:
      - '**/.terraform.lock.hcl'
      - '**/main.tf'
      - '.github/workflows/provider-lock.yml'
  push:
    branches:
      - master
    paths:
      - '**/.terraform.lock.hcl'
  schedule:
    # First of the month, for the staleness job below.
    - cron: '0 13 1 * *'
  workflow_dispatch:

jobs:
  staleness:
    # Pinning trades one failure mode for another. Unpinned, a bad release reaches
    # everything instantly. Pinned, the real risk is drifting quietly onto a provider
    # so old that the eventual upgrade is a project rather than a PR - which is the
    # position we have been in before and do not want again.
    #
    # Renovate is meant to prevent that by opening bumps continuously, but this check
    # deliberately does NOT depend on Renovate: if the app is never installed, or is
    # removed, or its PRs pile up unmerged, the drift is silent and nothing else would
    # tell us. Being behind is fine and expected. Being YEARS behind is the failure.
    name: 'Locked provider has not gone stale'
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare locked aws provider against upstream
        env:
          GH_TOKEN: ${{ github.token }}
          # Being a few months behind is the intended state with a 30-day soak plus
          # unmerged-PR lag. Half a year means the pipeline has stopped working.
          MAX_AGE_DAYS: '180'
        shell: bash
        run: |
          set -euo pipefail
          locked=$(awk '/provider "registry.opentofu.org\/hashicorp\/aws"/{f=1} f&&/version/{gsub(/[" ]/,"");sub(/version=/,"");print;exit}' terraform/physical/.terraform.lock.hcl)
          echo "locked aws provider: $locked"
          published=$(gh api "repos/hashicorp/terraform-provider-aws/releases/tags/v${locked}" --jq .published_at 2>/dev/null || echo "")
          if [ -z "$published" ]; then
            echo "::warning::could not resolve a release date for v${locked}; skipping the staleness check"
            exit 0
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$published" +%s) ) / 86400 ))
          echo "v${locked} was published ${published} (${age} days ago)"
          if [ "$age" -gt "$MAX_AGE_DAYS" ]; then
            echo "::error::the locked aws provider is ${age} days old (limit ${MAX_AGE_DAYS}). Provider updates have stopped flowing - check that Renovate is installed and that its PRs are being merged, then bump with: cd terraform/physical && tofu init -upgrade -backend=false && tofu providers lock -platform=linux_amd64 -platform=darwin_arm64"
            exit 1
          fi
          echo "within budget (${age}d <= ${MAX_AGE_DAYS}d)"

  platforms:
    name: 'Lock covers every platform we run on'
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [physical, logical]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          # Track the engine the fleet runs. This job regenerates the lock and fails on
          # any diff, so if it runs a different OpenTofu than the stacks do, it is
          # asserting something about a file the stacks will read differently.
          tofu_version: 1.11.8

      - name: Complete the lock and assert nothing was missing
        working-directory: terraform/${{ matrix.module }}
        shell: bash
        run: |
          set -euo pipefail
          # Modules must be installed first or the lock misses providers that only the
          # child modules require (terraform-aws-modules/*, the vendored ones).
          tofu init -backend=false -input=false -no-color
          # linux_amd64  - Spacelift workers (public pool and the gov private pool)
          # darwin_arm64 - engineer laptops and the live/tests harness
          tofu providers lock \
            -platform=linux_amd64 \
            -platform=darwin_arm64 \
            -no-color
          if ! git diff --quiet -- .terraform.lock.hcl; then
            echo "::error file=terraform/${{ matrix.module }}/.terraform.lock.hcl::lock file is incomplete for linux_amd64/darwin_arm64. Regenerate it: cd terraform/${{ matrix.module }} && tofu init -backend=false && tofu providers lock -platform=linux_amd64 -platform=darwin_arm64"
            git --no-pager diff -- .terraform.lock.hcl
            exit 1
          fi
          echo "lock file already covers linux_amd64 and darwin_arm64"
