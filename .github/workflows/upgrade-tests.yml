# Submit-only trigger for the upgrade harness on the argo-ops cluster. The job's whole
# life is ~30 seconds: assume the submitter role, create a harness-matrix Workflow, mark
# the head SHA pending (PRs only), exit. The workflow itself flips the commit status
# from its exit handler when the run finishes, so no runner sits waiting out a 2-hour
# test, and the same handler posts the outcome to Slack.
#
# This replaces the old label-gated go-test job, which never executed once (100/100
# runs skipped) and could not have passed if it had (wrong go version, no vault path).
name: Upgrade tests

on:
  workflow_dispatch:
    inputs:
      configs:
        description: 'JSON array of configs'
        default: '["min_default","bi_ha","full"]'
      from-ref:
        description: 'baseline ref'
        default: 'auto:latest-1'
      to-ref:
        description: 'target ref'
        default: 'auto:latest'
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: upgrade-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  id-token: write
  statuses: write

env:
  SUBMITTER_ROLE_ARN: arn:aws:iam::010601635461:role/argo-ops-pr-submitter
  CLUSTER: argo-ops
  REGION: us-east-1
  # PR runs test min + bi in parallel (semaphore is 2, so wall clock = bi_ha alone,
  # and two upgrade paths get covered). full stays nightly-only: it is the slowest
  # stack and its extra coverage (provisioned-RDS BI, istio strict) is not worth the
  # PR wait. Dispatch runs take the inputs (defaults = the nightly shape).
  CONFIGS: ${{ github.event_name == 'pull_request' && '["min_default","bi_ha"]' || inputs.configs }}
  FROM_REF: ${{ github.event_name == 'pull_request' && 'auto:latest' || inputs.from-ref }}
  TO_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.to-ref }}
  PR_REPO: ${{ github.event_name == 'pull_request' && github.repository || '' }}
  PR_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
  NAME_HINT: ${{ github.event_name == 'pull_request' && format('pr{0}', github.event.pull_request.number) || 'manual' }}

jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-upgrade-tests')
    runs-on: ubuntu-latest
    steps:
      # The submit heredoc expands these; refuse anything that could smuggle shell or
      # YAML through a dispatch input. PR-path values are a hex SHA and org/repo, which
      # pass these same shapes.
      - name: Validate parameters
        run: |
          set -euo pipefail
          [[ "$CONFIGS" =~ ^\[([[:space:]]*\"[a-z0-9_]+\"[[:space:]]*,?)*[[:space:]]*\]$ ]] || { echo "bad configs: $CONFIGS"; exit 1; }
          [[ "$FROM_REF" =~ ^[A-Za-z0-9._:/-]+$ ]] || { echo "bad from-ref"; exit 1; }
          [[ "$TO_REF" =~ ^[A-Za-z0-9._:/-]+$ ]] || { echo "bad to-ref"; exit 1; }

      - name: Assume the submitter role
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6
        with:
          role-to-assume: ${{ env.SUBMITTER_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Point kubectl at the ops cluster
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$REGION"

      - name: Submit the harness matrix workflow
        id: submit
        run: |
          set -euo pipefail
          WF=$(kubectl -n argo create -o name -f - <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Workflow
          metadata:
            generateName: harness-${NAME_HINT}-
            namespace: argo
            labels:
              harness/trigger: ${{ github.event_name == 'pull_request' && 'pr' || 'manual' }}
          spec:
            workflowTemplateRef:
              name: harness-matrix
            arguments:
              parameters:
                - name: configs
                  value: '${CONFIGS}'
                - name: scenario
                  value: upgrade
                - name: from-ref
                  value: '${FROM_REF}'
                - name: to-ref
                  value: '${TO_REF}'
                - name: pr-repo
                  value: '${PR_REPO}'
                - name: pr-sha
                  value: '${PR_SHA}'
          EOF
          )
          echo "workflow=${WF#workflow.argoproj.io/}" >> "$GITHUB_OUTPUT"
          echo "Submitted ${WF}" >> "$GITHUB_STEP_SUMMARY"

      - name: Mark the head SHA pending
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${PR_SHA}" \
            -f state=pending \
            -f context=harness/upgrade-tests \
            -f description="submitted ${{ steps.submit.outputs.workflow }}"
