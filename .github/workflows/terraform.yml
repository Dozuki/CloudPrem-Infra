name: 'Terraform'

on:
  push:
    branches:
    - master
  pull_request:

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The physical layer uses the rds-aurora module (master_password_wo),
          # which requires Terraform/OpenTofu >= 1.11.1 — run it on the fleet's
          # OpenTofu 1.11.8.
          - module: physical
            tool: tofu
          # The logical layer moved to OpenTofu: it uses provider for_each (azurerm
          # gated on var.cloud), which is OpenTofu-only, and the Spacelift logical
          # stacks run OPEN_TOFU. Validate it with tofu, not Terraform 1.5.7.
          - module: logical
            tool: tofu
          # Azure runs the same OpenTofu version as the other workload layers.
          # Validate the source layer on PRs before an azure-v* tag assembles it.
          - module: physical-azure
            tool: tofu

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup OpenTofu
      if: matrix.tool == 'tofu'
      uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
      with:
        # Match what the fleet runs (infra-live/_spacelift/stacks.tf). Validating on a
        # different version than Spacelift applies with is how a module change passes
        # CI and then fails on a real stack.
        tofu_version_file: azure-config/.opentofu-version

    - name: ${{ matrix.module }} Module Init
      run: ${{ matrix.tool }} init -backend=false -input=false
      working-directory: ./terraform/${{ matrix.module }}

    # Checks that all configuration files adhere to a canonical format
    - name: Format Check
      run: ${{ matrix.tool }} fmt -check
      working-directory: ./terraform/${{ matrix.module }}

    - name: Validate
      if: matrix.module == 'physical-azure'
      run: ${{ matrix.tool }} validate
      working-directory: ./terraform/${{ matrix.module }}

    # This action is configured with the AWS ruleset below. physical-azure has no
    # Azure TFLint plugin/config in the repo, so init + fmt + validate are its
    # meaningful credential-free PR gates; do not run AWS rules against it.
    - name: Terraform Linter
      if: matrix.module != 'physical-azure'
      uses: reviewdog/action-tflint@54a5e5aed57dcfbb4662ec548de876df33d6288d # v1
      with:
        github_token: ${{ secrets.github_token }}
        working_directory: "./terraform/${{ matrix.module }}"
        reporter: github-pr-review
        fail_on_error: "false"
        filter_mode: "nofilter"
        tflint_rulesets: "aws"

    # tfsec removed — deprecated in favor of Trivy. The reviewdog/action-tfsec
    # action crashes on tfsec v1.28.0 output parsing. Migrate to Trivy in a
    # follow-up PR if static security scanning is needed in CI.
