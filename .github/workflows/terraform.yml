name: 'Terraform'

on:
  push:
    branches:
    - master
  pull_request:

jobs:
  # The alerting lambdas are Python inside a Terraform repo, so nothing in the matrix
  # below ever executes them - tofu validate only checks that the archive_file source
  # exists. Their suite ran by hand until now, which meant the one guarantee protecting
  # the aurora migration task (it has no CloudWatch alarm anywhere, so its Slack card is
  # its only alerting) held only when someone remembered to run it.
  lambda-tests:
    name: 'Lambda tests'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'   # the runtime aws_lambda_function.sns_to_slack declares

    # The suite has no test framework and no fixtures on disk; boto3 is its only
    # dependency, and only because the module under test imports it at import time.
    - name: Install boto3
      run: pip install --disable-pip-version-check boto3

    - name: sns_to_slack
      run: python3 test_sns_to_slack.py
      working-directory: ./terraform/physical/util

  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The physical layer uses the rds-aurora module (master_password_wo),
          # which requires Terraform/OpenTofu >= 1.11.1 — run it on the fleet's
          # OpenTofu 1.12.5.
          - module: physical
            tool: tofu
          # The logical layer moved to OpenTofu: it uses provider for_each (azurerm
          # gated on var.cloud), which is OpenTofu-only, and the Spacelift logical
          # stacks run OPEN_TOFU. Validate it with tofu, not Terraform 1.5.7.
          - module: logical
            tool: tofu
          # Azure runs the same OpenTofu version as the other workload layers.
          # Validate the source layer on PRs before an azure-v* tag assembles it.
          - module: physical-azure
            tool: tofu

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

    - name: Setup OpenTofu
      if: matrix.tool == 'tofu'
      uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
      with:
        # Match what the fleet runs (infra-live/_spacelift/stacks.tf). Validating on a
        # different version than Spacelift applies with is how a module change passes
        # CI and then fails on a real stack.
        tofu_version_file: azure-config/.opentofu-version

    - name: ${{ matrix.module }} Module Init
      run: ${{ matrix.tool }} init -backend=false -input=false
      working-directory: ./terraform/${{ matrix.module }}

    # Checks that all configuration files adhere to a canonical format
    - name: Format Check
      run: ${{ matrix.tool }} fmt -check
      working-directory: ./terraform/${{ matrix.module }}

    - name: Validate
      if: matrix.module == 'physical-azure'
      run: ${{ matrix.tool }} validate
      working-directory: ./terraform/${{ matrix.module }}

    # The AWS-backed layers have local configs that pin and enable the AWS
    # ruleset. physical-azure has no Azure TFLint plugin/config in the repo, so
    # init + fmt + validate are its meaningful credential-free PR gates; do not
    # run AWS rules against it.
    - name: Terraform Linter
      if: matrix.module != 'physical-azure'
      uses: reviewdog/action-tflint@54a5e5aed57dcfbb4662ec548de876df33d6288d # v1
      with:
        github_token: ${{ secrets.github_token }}
        working_directory: "./terraform/${{ matrix.module }}"
        reporter: github-pr-review
        # Keep warnings as review comments, but fail for configuration/runtime
        # errors instead of allowing a broken lint invocation to pass CI.
        fail_level: "error"
        filter_mode: "nofilter"
        tflint_init: "true"

    # tfsec removed — deprecated in favor of Trivy. The reviewdog/action-tfsec
    # action crashes on tfsec v1.28.0 output parsing. Migrate to Trivy in a
    # follow-up PR if static security scanning is needed in CI.
