# RBAC for the PR trigger's submit-only role (argo-ops-pr-submitter). The EKS access
# entry maps that role into the harness-submitters group with NO cluster access policy,
# so this Role is the entirety of what a compromised Actions job could do: create and
# read Workflows in this namespace. No delete, no pod exec, no secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harness-pr-submitter
  namespace: argo
rules:
  - apiGroups: ['argoproj.io']
    resources: ['workflows']
    # patch belongs HERE, not on the shared argo-workflow SA: the submitter job
    # stops superseded same-PR matrices (shutdown: Stop + harness/superseded)
    # before creating the new one, and this Role binds only the GitHub OIDC
    # identity - no workload pod (Terraform phases included) can patch a
    # workflow. No delete: history is never removable this way.
    verbs: ['create', 'get', 'list', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harness-pr-submitter
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harness-pr-submitter
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: harness-submitters
