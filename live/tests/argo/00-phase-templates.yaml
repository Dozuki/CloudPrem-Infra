# Phase library: the reusable building block every entry point calls.
#
# Everything about a phase derives from --run-id + --config, so each is independently
# re-runnable: a phase that dies is retried and reconstructs its state from the run
# manifest in S3 plus the live TF outputs, rather than from anything a parent process held
# in memory. That re-entrancy is the whole reason the harness was split into subcommands.
#
# Apply with:
#   kubectl --context argo-ops -n argo apply -f live/tests/argo/
#
# The ConfigMap below is the single place to edit run-wide settings; the entry-point
# templates read it with valueFrom.configMapKeyRef rather than duplicating literals.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harness-config
  namespace: argo
  labels:
    # Required for workflows to read these keys via parameter valueFrom.configMapKeyRef;
    # without it the controller refuses with "ConfigMap does not exist".
    workflows.argoproj.io/configmap-type: Parameter
data:
  # Pinned by DIGEST, not tag. The ECR repo allows mutable tags so `latest` can move, and
  # a moving tag must never swap the runtime under a workflow already running. The
  # "Harness image" workflow prints the digest to paste here on every publish.
  image: '069174876992.dkr.ecr.us-east-1.amazonaws.com/mpc-test-harness@sha256:a6d773946d802de857e6081e240960c9a78b4c8edd2c566b27e767b5e8ab2029'
  ddvtest_account_id: '076248559428'
  # Already exists (infra-tf modules/cloudprem-test-harness). Its trust policy needs the
  # Argo workflow role added before any of this can assume it.
  assume_role_arn: 'arn:aws:iam::076248559428:role/cloudprem-upgrade-tests'
  region: 'us-east-1'
  dr_region: 'us-west-2'
  # PrivateLink endpoint in the Argo VPC: no port-forward, unlike a laptop run.
  vault_addr: 'http://vault.internal.dozuki.com:8200'
  state_bucket: 'dozuki-terraform-state-us-east-1-076248559428'
  # Where harness verdicts post. Deploy-pipeline signal, so #mpc-deploys, NOT the
  # shared Vault channelId (that one points at #spacelift-alerts and other
  # consumers read it). Channel IDs are not secrets; config lives here.
  slack_channel: 'C0BMGD1KE8Z'
  # Resource Reaper is the only control plane for cleanup decisions. The janitor scan
  # publishes normalized findings but is permanently report-only; the separate worker
  # can consume one signed/durable Reaper action only after the rollout flag is enabled.
  reaper_report_bucket: 'resource-reaper-reports-076248559428'
  reaper_action_queue_url: 'https://sqs.us-east-1.amazonaws.com/076248559428/resource-reaper-harness-actions.fifo'
  reaper_result_queue_url: 'https://sqs.us-east-1.amazonaws.com/076248559428/resource-reaper-harness-results.fifo'
  reaper_control_table: 'resource-reaper-control'
  # Marks the report and every cleanup unit as shadow evidence for parity analysis,
  # including empty reports. This is not an authority gate: infra-tf
  # harness_actions_enabled and the independent local reaper_actions_enabled switch
  # both remain false during shadowing.
  reaper_shadow: 'true'
  reaper_actions_enabled: 'false'
  # Keep the guarded direct path available for rollback, but route normal janitor
  # findings only through the consolidated Resource Reaper report in #mpc-alerts.
  reaper_direct_slack_enabled: 'false'
---
# DDVtest has a hard ceiling of 10 VPCs per region and each test stack is about one VPC
# (recovery is two). A nightly matrix plus a couple of PR runs will exhaust it mid-apply,
# which surfaces as a confusing quota error deep inside a terragrunt run.
#
# One semaphore shared by every entry point, so the cron and PR paths cannot collectively
# overshoot. Raise this only alongside the quota.
apiVersion: v1
kind: ConfigMap
metadata:
  name: harness-semaphore
  namespace: argo
data:
  concurrent-stacks: '2'
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: harness-phase
  namespace: argo
spec:
  templates:
    # One template for all four subcommands: same container, different argv.
    - name: run
      inputs:
        parameters:
          - name: phase
          - name: run-id
          - name: config
          - name: extra-args
            value: ''
          - name: repo-ref
            # 'auto' = the caller has no opinion. Only teardown can act on it (it asks the
            # run manifest for the ref the stack was built at); every other phase resolves
            # it to master, which is what this literally said before. See
            # docker-entrypoint.sh's teardown ref resolution.
            value: auto
          # Phases have very different shapes: provision builds a cluster, validate polls
          # assertions. A single deadline would either strangle provision or let validate
          # hang for an hour.
          - name: deadline
            value: '3600'
          # Only meaningful for teardown; see the flag assembly below.
          - name: keep-on-failure
            value: 'false'
          - name: workflow-status
            value: ''
      activeDeadlineSeconds: '{{inputs.parameters.deadline}}'
      retryStrategy:
        limit: '2'
        # OnError, deliberately NOT OnFailure. OnError covers the pod dying: eviction, OOM,
        # spot reclaim, node replacement, all of which re-entrancy makes safe to repeat. A
        # non-zero exit from the harness is a real verdict (a failed assertion, a rejected
        # apply); retrying it would burn another hour and report the same thing.
        retryPolicy: OnError
        backoff:
          duration: '30s'
          factor: '2'
          maxDuration: '5m'
      # Canary for controller-level archiveLogs (infra-tf modules/argo-ops-cluster/argo.tf):
      # prove the emissary executor can actually read and upload this pod's log before
      # flipping the flag fleet-wide. The Kubernetes side is unverified - Role
      # argo-workflows-workflow grants only workflowtaskresults create+patch, no pods/log -
      # and if a log upload fails Argo marks the node Errored, which retryStrategy above
      # (limit 2, OnError) turns into up to three reruns of an hour-plus phase, each holding
      # harness-semaphore (concurrent-stacks 2) against a DDVtest VPC ceiling of 10. Template-
      # level here on purpose so a bad canary only costs this one template, not the matrix.
      # Expected to be superseded once the controller-level flag lands and is confirmed live;
      # this line can come out once that duplicate coverage is redundant.
      archiveLocation:
        archiveLogs: true
      container:
        image: '{{workflow.parameters.image}}'
        # bash -c rather than an args list because extra-args carries multiple flags and an
        # args entry is one argv element: '--scenario upgrade --from-ref x' would reach the
        # CLI as a single unparseable token.
        command: ['/bin/bash', '-c']
        args:
          - |
            set -euo pipefail
            FLAGS="{{inputs.parameters.extra-args}}"

            # Teardown's two conditional flags are assembled here rather than with an Argo
            # expression tag, so the logic is readable in a pod log and does not depend on
            # expr semantics.
            if [ "{{inputs.parameters.phase}}" = teardown ]; then
              if [ "${KEEP_ON_FAILURE}" = true ]; then
                FLAGS="${FLAGS} --keep-on-failure"
              fi
              # Empty when a phase is run directly rather than as an exit handler.
              if [ -n "${WORKFLOW_STATUS}" ] && [ "${WORKFLOW_STATUS}" != Succeeded ]; then
                FLAGS="${FLAGS} --failed"
              fi
            fi

            # shellcheck disable=SC2086  # FLAGS must word-split into separate arguments.
            exec /usr/local/bin/docker-entrypoint.sh "{{inputs.parameters.phase}}" \
              --run-id "{{inputs.parameters.run-id}}" \
              --config "{{inputs.parameters.config}}" \
              --profile ddvtest \
              --account-id "{{workflow.parameters.ddvtest-account-id}}" \
              --region "{{workflow.parameters.region}}" \
              --state-bucket "{{workflow.parameters.state-bucket}}" \
              --repo-dir /workspace/repo \
              ${FLAGS}
        env:
          - name: KEEP_ON_FAILURE
            value: '{{inputs.parameters.keep-on-failure}}'
          - name: WORKFLOW_STATUS
            value: '{{inputs.parameters.workflow-status}}'
          - name: HARNESS_REPO_DIR
            value: /workspace/repo
          - name: HARNESS_REPO_REF
            value: '{{inputs.parameters.repo-ref}}'
          - name: HARNESS_RUN_LABEL
            value: '{{inputs.parameters.run-id}}'
          - name: HARNESS_ASSUME_ROLE_ARN
            value: '{{workflow.parameters.assume-role-arn}}'
          - name: VAULT_ADDR
            value: '{{workflow.parameters.vault-addr}}'
          # The entrypoint default is admin (a laptop identity). The pod's identity is
          # registered under the deployer Vault role (vault-config deployer_iam_role_arns).
          - name: VAULT_AWS_ROLE
            value: deployer
          - name: DR_REGION
            value: '{{workflow.parameters.dr-region}}'
          - name: DDVTEST_ACCOUNT_ID
            value: '{{workflow.parameters.ddvtest-account-id}}'
          - name: APP_NAMESPACE
            value: dozuki
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          # Sized for the tofu process and the provider plugins it forks. The original
          # 1Gi request let Auto Mode pack a whole logical-layer run (kubernetes provider
          # + hundreds of CRD schemas) next to the Argo control plane on one c6a.large,
          # and the node swapped so hard (zram) that provider refreshes and vault logins
          # stalled for HOURS and looked like network hangs. Request what the run
          # actually uses so the pod gets a node with real headroom.
          requests:
            cpu: '1'
            memory: '4Gi'
          limits:
            memory: '6Gi'
