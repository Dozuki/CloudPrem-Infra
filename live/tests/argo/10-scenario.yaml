# Per-config child workflow: the isolation layer.
#
# One of these runs one config end to end. Submitting one per config rather than looping
# inside a single workflow is what makes "re-run just `full`" a first-class operation: each
# child has its own UI, its own retry budget, its own resume scope, and its own teardown
# exit handler. A config that fails does not touch the others.
#
# The teardown is an exit handler, not a final step, because a final step does not run when
# an earlier step fails - which is exactly when teardown matters most. This is the
# equivalent of run.sh's EXIT trap, except it is not tied to the process that created the
# stack: teardown reads the run manifest from S3, so any pod (this one, a retry, or the
# Phase 4 janitor) can clean up a given run.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: harness-scenario
  namespace: argo
spec:
  entrypoint: scenario
  serviceAccountName: argo-workflow
  # The stack, not the pod, is the scarce resource: one test stack is about one VPC against
  # DDVtest's ceiling of 10. Held for the life of the child, so it covers provision through
  # teardown rather than releasing between phases and letting another run slip in.
  synchronization:
    semaphores:
      - configMapKeyRef:
          name: harness-semaphore
          key: concurrent-stacks
  arguments:
    parameters:
      - name: config
      # Defaults to the workflow's own name: unique per submission, and stable across a
      # retry or resume of the SAME workflow, which is exactly what the S3 state prefix
      # ${run-id}-${config} needs to stay re-entrant.
      - name: run-id
        value: '{{workflow.name}}'
      - name: scenario
        value: upgrade
      - name: from-ref
        value: 'auto:latest-1'
      - name: to-ref
        value: 'auto:latest'
      - name: repo-ref
        # 'auto' lets a teardown resolve the ref from its own run manifest instead of
        # relying on the submitter to remember the frozen ref (Lodestar-1xm.36.5). An
        # explicit value still wins and is logged as a deviation.
        value: auto
      # Leaves a failed stack standing for live debugging. Costs money until someone tears
      # it down by hand, so it is off by default and the reaper's deleteAfter tag is the
      # backstop.
      - name: keep-on-failure
        value: 'false'
      # Set on PR-triggered runs (empty on cron/manual). The staleness gate uses them:
      # every push to master rebuilds the release PR and submits a fresh harness run,
      # so a run that queued behind the semaphore is often testing a superseded SHA by
      # the time it is admitted. Skipping it then saves a 1-2h stack for nothing and
      # the red-herring failure Slack posts when orphaned runs collide.
      - name: pr-repo
        value: ''
      - name: pr-sha
        value: ''
      - name: image
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: image
      - name: ddvtest-account-id
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: ddvtest_account_id
      - name: assume-role-arn
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: assume_role_arn
      - name: region
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: region
      - name: dr-region
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: dr_region
      - name: vault-addr
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: vault_addr
      - name: state-bucket
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: state_bucket
      # Test-only: forces the HelmRelease wait budget (see 00-phase-templates.yaml's
      # hr-budget-override). Empty for every real run; a live-fire passes
      # `-p hr-budget-override=5m` at submit time to reach the timeout branch on
      # purpose. Deliberately NOT a configMapKeyRef - a ConfigMap value would apply to
      # every concurrent run, and this must only ever affect the one run that asks.
      - name: hr-budget-override
        value: ''
      - name: residual-enforce
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: residual_enforce
          # Fails safe to enforce if the key is ever missing from harness-config,
          # instead of erroring the whole workflow at submission. Also removes the
          # apply-ordering coupling that required 00-phase-templates.yaml (which owns
          # the ConfigMap) to land before this file.
          default: 'true'

  # A run is 1-2 hours and the recovery path is longer. This is a backstop against a hung
  # run holding the semaphore forever, not a target.
  activeDeadlineSeconds: 21600

  # Auto Mode consolidation drains "underutilized" nodes whenever load shifts, and a
  # drain mid-run kills a tofu apply (and strands half-written state, see the orphan
  # sweeps). This annotation makes Karpenter leave the node alone while a harness pod
  # is on it.
  podMetadata:
    annotations:
      karpenter.sh/do-not-disrupt: 'true'

  # Keep failures around for a few days to inspect; successes are noise once the artifacts
  # are in S3.
  ttlStrategy:
    secondsAfterSuccess: 86400
    secondsAfterFailure: 259200

  # Default is OnWorkflowSuccess, which leaves a failed run's 10Gi workspace bound until
  # ttlStrategy reaps the workflow three days later. Teardown is an exit handler, so it
  # has already finished with the clone and the worktrees by the time the workflow is
  # marked complete, and nothing reads the volume after that. Logs live in S3, not here.
  volumeClaimGC:
    strategy: OnWorkflowCompletion

  onExit: teardown

  # The repo clone is the one thing worth sharing between phases: a full clone with tags,
  # which the harness needs because it builds a git worktree per ref. With this volume the
  # first phase clones and the rest do an incremental fetch. It also carries the generated
  # live/ envs and the worktrees themselves, which teardown needs to destroy against the
  # code that was actually applied.
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            # The clone plus two worktrees plus generated envs. Provider plugins do NOT
            # land here: they symlink into the image's baked cache.
            storage: 10Gi

  templates:
    - name: scenario
      steps:
        # Runs AFTER the semaphore admits this child, which is the moment that matters:
        # a queued run is current when submitted and stale when admitted. Asks whether
        # to-ref is still the head of an open PR (unauthenticated; the repo is public).
        # Fails OPEN on any API problem - wasting a run is recoverable, false-skipping
        # a real one is not. Prints exactly "run" or "skip".
        - - name: gate
            template: staleness-gate
        - - name: provision
            when: '{{steps.gate.outputs.result}} == run'
            templateRef:
              name: harness-phase
              template: run
            arguments:
              parameters:
                - name: phase
                  value: provision
                - name: run-id
                  value: '{{workflow.parameters.run-id}}'
                - name: config
                  value: '{{workflow.parameters.config}}'
                - name: repo-ref
                  value: '{{workflow.parameters.repo-ref}}'
                # Consensus-panel finding: this pod's activeDeadlineSeconds must satisfy
                # setup + apply + wait_budget + dump(<=10m) + upload(<=10m) + margin <= deadline
                # (harness/phases.go's hrWaitReserve = dump + upload + 5m margin = 25m).
                # Provision's wait budget is hrWaitBudgetInstall = 90m; 90m + 25m = 115m
                # alone, so the old 5400s (90m) deadline killed the pod before the wait
                # could ever expire and trigger the diagnosis it exists to produce -
                # never mind the apply time before the wait even starts. 9000s (150m)
                # leaves ~35m for cluster setup + terragrunt apply ahead of the wait.
                # harness/phases.go also clamps the wait budget itself at runtime
                # (HARNESS_POD_DEADLINE) so a future edit to either number alone cannot
                # reopen this gap; live/tests/harness/deadline_invariant_test.go parses
                # this file to keep the two in sync.
                - name: deadline
                  value: '9000'
                - name: residual-enforce
                  value: '{{workflow.parameters.residual-enforce}}'
                - name: hr-budget-override
                  value: '{{workflow.parameters.hr-budget-override}}'
                - name: extra-args
                  value: >-
                    --scenario {{workflow.parameters.scenario}}
                    --from-ref {{workflow.parameters.from-ref}}
                    --to-ref {{workflow.parameters.to-ref}}

        # Skipped for the fresh scenario, which has no baseline to upgrade from.
        - - name: upgrade
            when: '{{workflow.parameters.scenario}} == upgrade && {{steps.gate.outputs.result}} == run'
            templateRef:
              name: harness-phase
              template: run
            arguments:
              parameters:
                - name: phase
                  value: upgrade
                - name: run-id
                  value: '{{workflow.parameters.run-id}}'
                - name: config
                  value: '{{workflow.parameters.config}}'
                - name: repo-ref
                  value: '{{workflow.parameters.repo-ref}}'
                # Upgrade runs no HelmRelease wait (Upgrade in phases.go applies the
                # target ref and returns - Validate is the phase that waits), so it is
                # not part of the deadline/wait_budget invariant above and stays at the
                # original 5400s.
                - name: deadline
                  value: '5400'
                - name: residual-enforce
                  value: '{{workflow.parameters.residual-enforce}}'
                - name: hr-budget-override
                  value: '{{workflow.parameters.hr-budget-override}}'

        - - name: validate
            when: '{{steps.gate.outputs.result}} == run'
            templateRef:
              name: harness-phase
              template: run
            arguments:
              parameters:
                - name: phase
                  value: validate
                - name: run-id
                  value: '{{workflow.parameters.run-id}}'
                - name: config
                  value: '{{workflow.parameters.config}}'
                - name: repo-ref
                  value: '{{workflow.parameters.repo-ref}}'
                # Same invariant as provision (see that step's comment). Validate's wait
                # budget is hrWaitBudgetUpgrade = 75m; 75m + hrWaitReserve's 25m = 100m
                # alone, so the old 5400s (90m) deadline could kill the pod before the
                # wait expired too. 7200s (120m) leaves ~20m for setup ahead of the wait.
                - name: deadline
                  value: '7200'
                - name: residual-enforce
                  value: '{{workflow.parameters.residual-enforce}}'
                - name: hr-budget-override
                  value: '{{workflow.parameters.hr-budget-override}}'

    # The staleness check itself. A script template so stdout is the step result the
    # `when:` clauses above compare against. GET /commits/{sha}/pulls lists the open
    # PRs whose head branch contains the SHA; if none of them has it as the CURRENT
    # head, a newer submission exists for this PR and this run is superseded. A
    # skipped run Succeeds (all phases skip), so it makes no failure noise; the
    # superseding run owns the real verdict.
    - name: staleness-gate
      activeDeadlineSeconds: 120
      script:
        image: '{{workflow.parameters.image}}'
        command: ['/bin/bash']
        source: |
          set -uo pipefail
          PR_REPO='{{workflow.parameters.pr-repo}}'
          PR_SHA='{{workflow.parameters.pr-sha}}'
          if [ -z "$PR_REPO" ] || [ -z "$PR_SHA" ]; then
            echo "not a PR run; proceeding" >&2; echo run; exit 0
          fi
          PULLS=$(curl -sf --max-time 20 -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${PR_REPO}/commits/${PR_SHA}/pulls") \
            || { echo "github api unreachable; failing open" >&2; echo run; exit 0; }
          HEADS=$(printf '%s' "$PULLS" | jq -r '.[].head.sha' 2>/dev/null) \
            || { echo "unparseable api response; failing open" >&2; echo run; exit 0; }
          if [ -z "$HEADS" ]; then
            echo "sha not on any open PR (closed or merged); failing open" >&2; echo run; exit 0
          fi
          if printf '%s\n' "$HEADS" | grep -qx "$PR_SHA"; then
            echo "still the PR head" >&2; echo run
          else
            echo "superseded: PR head moved to $(printf '%s' "$HEADS" | head -1)" >&2; echo skip
          fi
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 128Mi }

    - name: teardown
      # The shared phase template retries OnError only, which is right for provision and
      # validate: their non-zero exit IS the verdict the run exists to produce, and
      # rerunning it burns another hour to report the same thing. Teardown inverts that.
      # A non-zero exit here is a failed cleanup, not an answer, and the stack it failed
      # to destroy keeps its VPC against DDVtest's ceiling of 10 until a human notices.
      # Seven leaked stacks over three days is what that costs. So the retry lives here,
      # on the exit handler, rather than in the phase library where it would also start
      # rerunning failed assertions.
      #
      # Always, not OnFailure: an exit(1) from terragrunt destroy and an evicted pod
      # strand the same stack. Both are safe to repeat because teardown reloads the run
      # manifest from S3 and destroy is convergent.
      #
      # Up to three attempts, and read that as "up to". The failures worth repeating are
      # AWS-side and clear in minutes (ENI detach lag, DependencyViolation, an NLB still
      # protected) after the harness has exhausted its own narrow internal retry, so in the
      # common case all three fit easily. The ones that never clear (a state lock held by a
      # dead process, expired credentials) fail in seconds, so burning three of those is
      # cheap. But a teardown that runs near its full 3h deadline gets two attempts, not
      # three: the second finishes past the window below and the third is never scheduled.
      # That is accepted rather than fixed by shortening the per-attempt deadline, because
      # a destroy waiting on a slow RDS deletion is exactly the case where cutting the
      # attempt short would create the orphan this retry exists to prevent.
      #
      # Backoff starts at 2m rather than seconds because destroyModule already spent its
      # internal retry budget on the fast-transient class before the phase exited; whatever
      # is left needs AWS minutes.
      #
      # maxDuration is measured from the FIRST attempt's start, not per attempt, and it is
      # NOT the real ceiling. The controller refuses to schedule a retry once the workflow
      # deadline has passed, and that check has no exit-handler exemption, so
      # activeDeadlineSeconds above (6h for the whole run) bounds this sequence in practice.
      # A run that spends 5h in provision and validate leaves teardown about an hour of
      # retry budget no matter what is written here. 4h is a ceiling for the case where
      # teardown itself is the thing burning time, not a promise of four hours.
      #
      # Bounding it at all matters because the workflow holds harness-semaphore through the
      # exit handler, so spinning on one of two slots starves the other run against a VPC
      # ceiling of 10. If this node ends with "Max duration limit exceeded", the budget ran
      # out on wall clock and the stack needs cleanup-orphans.sh, not another submit.
      #
      # This nests inside the shared phase template's own OnError retry
      # (00-phase-templates.yaml), which covers a pod dying rather than a clean exit(1).
      # That inner layer is capped at 5m from its first attempt, so in practice it only
      # catches a pod that dies in the opening minutes; anything later falls through to
      # this one. Deliberately left alone: widening it would revive OnError retries for
      # provision and validate too, where a rerun costs 90 minutes to reprint the same
      # verdict.
      retryStrategy:
        limit: '2'
        retryPolicy: Always
        backoff:
          duration: '2m'
          factor: '2'
          maxDuration: '4h'
      steps:
        - - name: destroy
            templateRef:
              name: harness-phase
              template: run
            arguments:
              parameters:
                - name: phase
                  value: teardown
                - name: run-id
                  value: '{{workflow.parameters.run-id}}'
                - name: config
                  value: '{{workflow.parameters.config}}'
                - name: repo-ref
                  value: '{{workflow.parameters.repo-ref}}'
                # Destroy is the slowest phase on a bad day: RDS deletion, ENI detachment
                # and NAT teardown all serialise, and the harness retries transient faults
                # internally. The first live full-stack destroy blew through 90 minutes and
                # was deadline-killed with only the Aurora tail left; a killed teardown
                # strands the stack, so this errs long. The reaper's deleteAfter tag is the
                # backstop if even this expires.
                - name: deadline
                  value: '10800'
                - name: keep-on-failure
                  value: '{{workflow.parameters.keep-on-failure}}'
                # The exit handler's view of how the run ended. The phase template turns a
                # non-Succeeded status into --failed, which is what triggers the full
                # diagnostics dump before the stack goes away.
                - name: workflow-status
                  value: '{{workflow.status}}'
                - name: residual-enforce
                  value: '{{workflow.parameters.residual-enforce}}'
