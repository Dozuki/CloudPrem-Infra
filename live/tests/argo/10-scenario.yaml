# Per-config child workflow: the isolation layer.
#
# One of these runs one config end to end. Submitting one per config rather than looping
# inside a single workflow is what makes "re-run just `full`" a first-class operation: each
# child has its own UI, its own retry budget, its own resume scope, and its own teardown
# exit handler. A config that fails does not touch the others.
#
# The teardown is an exit handler, not a final step, because a final step does not run when
# an earlier step fails - which is exactly when teardown matters most. This is the
# equivalent of run.sh's EXIT trap, except it is not tied to the process that created the
# stack: teardown reads the run manifest from S3, so any pod (this one, a retry, or the
# Phase 4 janitor) can clean up a given run.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: harness-scenario
  namespace: argo
spec:
  entrypoint: scenario
  serviceAccountName: argo-workflow
  # The stack, not the pod, is the scarce resource: one test stack is about one VPC against
  # DDVtest's ceiling of 10. Held for the life of the child, so it covers provision through
  # teardown rather than releasing between phases and letting another run slip in.
  synchronization:
    semaphores:
      - configMapKeyRef:
          name: harness-semaphore
          key: concurrent-stacks
  arguments:
    parameters:
      - name: config
      # Defaults to the workflow's own name: unique per submission, and stable across a
      # retry or resume of the SAME workflow, which is exactly what the S3 state prefix
      # ${run-id}-${config} needs to stay re-entrant.
      - name: run-id
        value: '{{workflow.name}}'
      - name: scenario
        value: upgrade
      - name: from-ref
        value: 'auto:latest-1'
      - name: to-ref
        value: 'auto:latest'
      - name: repo-ref
        value: master
      # Leaves a failed stack standing for live debugging. Costs money until someone tears
      # it down by hand, so it is off by default and the reaper's deleteAfter tag is the
      # backstop.
      - name: keep-on-failure
        value: 'false'
      # Set on PR-triggered runs (empty on cron/manual). The staleness gate uses them:
      # every push to master rebuilds the release PR and submits a fresh harness run,
      # so a run that queued behind the semaphore is often testing a superseded SHA by
      # the time it is admitted. Skipping it then saves a 1-2h stack for nothing and
      # the red-herring failure Slack posts when orphaned runs collide.
      - name: pr-repo
        value: ''
      - name: pr-sha
        value: ''
      - name: image
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: image
      - name: ddvtest-account-id
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: ddvtest_account_id
      - name: assume-role-arn
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: assume_role_arn
      - name: region
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: region
      - name: dr-region
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: dr_region
      - name: vault-addr
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: vault_addr
      - name: state-bucket
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: state_bucket

  # A run is 1-2 hours and the recovery path is longer. This is a backstop against a hung
  # run holding the semaphore forever, not a target.
  activeDeadlineSeconds: 21600

  # Auto Mode consolidation drains "underutilized" nodes whenever load shifts, and a
  # drain mid-run kills a tofu apply (and strands half-written state, see the orphan
  # sweeps). This annotation makes Karpenter leave the node alone while a harness pod
  # is on it.
  podMetadata:
    annotations:
      karpenter.sh/do-not-disrupt: 'true'

  # Keep failures around for a few days to inspect; successes are noise once the artifacts
  # are in S3.
  ttlStrategy:
    secondsAfterSuccess: 86400
    secondsAfterFailure: 259200

  # Default is OnWorkflowSuccess, which leaves a failed run's 10Gi workspace bound until
  # ttlStrategy reaps the workflow three days later. Teardown is an exit handler, so it
  # has already finished with the clone and the worktrees by the time the workflow is
  # marked complete, and nothing reads the volume after that. Logs live in S3, not here.
  volumeClaimGC:
    strategy: OnWorkflowCompletion

  onExit: teardown

  # The repo clone is the one thing worth sharing between phases: a full clone with tags,
  # which the harness needs because it builds a git worktree per ref. With this volume the
  # first phase clones and the rest do an incremental fetch. It also carries the generated
  # live/ envs and the worktrees themselves, which teardown needs to destroy against the
  # code that was actually applied.
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            # The clone plus two worktrees plus generated envs. Provider plugins do NOT
            # land here: they symlink into the image's baked cache.
            storage: 10Gi

  templates:
    - name: scenario
      steps:
        # Runs AFTER the semaphore admits this child, which is the moment that matters:
        # a queued run is current when submitted and stale when admitted. Asks whether
        # to-ref is still the head of an open PR (unauthenticated; the repo is public).
        # Fails OPEN on any API problem - wasting a run is recoverable, false-skipping
        # a real one is not. Prints exactly "run" or "skip".
        - - name: gate
            template: staleness-gate
        - - name: provision
            when: '{{steps.gate.outputs.result}} == run'
            templateRef:
              name: harness-phase
              template: run
            arguments:
              parameters:
                - name: phase
                  value: provision
                - name: run-id
                  value: '{{workflow.parameters.run-id}}'
                - name: config
                  value: '{{workflow.parameters.config}}'
                - name: repo-ref
                  value: '{{workflow.parameters.repo-ref}}'
                - name: deadline
                  value: '5400'
                - name: extra-args
                  value: >-
                    --scenario {{workflow.parameters.scenario}}
                    --from-ref {{workflow.parameters.from-ref}}
                    --to-ref {{workflow.parameters.to-ref}}

        # Skipped for the fresh scenario, which has no baseline to upgrade from.
        - - name: upgrade
            when: '{{workflow.parameters.scenario}} == upgrade && {{steps.gate.outputs.result}} == run'
            templateRef:
              name: harness-phase
              template: run
            arguments:
              parameters:
                - name: phase
                  value: upgrade
                - name: run-id
                  value: '{{workflow.parameters.run-id}}'
                - name: config
                  value: '{{workflow.parameters.config}}'
                - name: repo-ref
                  value: '{{workflow.parameters.repo-ref}}'
                - name: deadline
                  value: '5400'

        - - name: validate
            when: '{{steps.gate.outputs.result}} == run'
            templateRef:
              name: harness-phase
              template: run
            arguments:
              parameters:
                - name: phase
                  value: validate
                - name: run-id
                  value: '{{workflow.parameters.run-id}}'
                - name: config
                  value: '{{workflow.parameters.config}}'
                - name: repo-ref
                  value: '{{workflow.parameters.repo-ref}}'
                - name: deadline
                  value: '2700'

    # The staleness check itself. A script template so stdout is the step result the
    # `when:` clauses above compare against. GET /commits/{sha}/pulls lists the open
    # PRs whose head branch contains the SHA; if none of them has it as the CURRENT
    # head, a newer submission exists for this PR and this run is superseded. A
    # skipped run Succeeds (all phases skip), so it makes no failure noise; the
    # superseding run owns the real verdict.
    - name: staleness-gate
      activeDeadlineSeconds: 120
      script:
        image: '{{workflow.parameters.image}}'
        command: ['/bin/bash']
        source: |
          set -uo pipefail
          PR_REPO='{{workflow.parameters.pr-repo}}'
          PR_SHA='{{workflow.parameters.pr-sha}}'
          if [ -z "$PR_REPO" ] || [ -z "$PR_SHA" ]; then
            echo "not a PR run; proceeding" >&2; echo run; exit 0
          fi
          PULLS=$(curl -sf --max-time 20 -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${PR_REPO}/commits/${PR_SHA}/pulls") \
            || { echo "github api unreachable; failing open" >&2; echo run; exit 0; }
          HEADS=$(printf '%s' "$PULLS" | jq -r '.[].head.sha' 2>/dev/null) \
            || { echo "unparseable api response; failing open" >&2; echo run; exit 0; }
          if [ -z "$HEADS" ]; then
            echo "sha not on any open PR (closed or merged); failing open" >&2; echo run; exit 0
          fi
          if printf '%s\n' "$HEADS" | grep -qx "$PR_SHA"; then
            echo "still the PR head" >&2; echo run
          else
            echo "superseded: PR head moved to $(printf '%s' "$HEADS" | head -1)" >&2; echo skip
          fi
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 128Mi }

    - name: teardown
      steps:
        - - name: destroy
            templateRef:
              name: harness-phase
              template: run
            arguments:
              parameters:
                - name: phase
                  value: teardown
                - name: run-id
                  value: '{{workflow.parameters.run-id}}'
                - name: config
                  value: '{{workflow.parameters.config}}'
                - name: repo-ref
                  value: '{{workflow.parameters.repo-ref}}'
                # Destroy is the slowest phase on a bad day: RDS deletion, ENI detachment
                # and NAT teardown all serialise, and the harness retries transient faults
                # internally. The first live full-stack destroy blew through 90 minutes and
                # was deadline-killed with only the Aurora tail left; a killed teardown
                # strands the stack, so this errs long. The reaper's deleteAfter tag is the
                # backstop if even this expires.
                - name: deadline
                  value: '10800'
                - name: keep-on-failure
                  value: '{{workflow.parameters.keep-on-failure}}'
                # The exit handler's view of how the run ended. The phase template turns a
                # non-Succeeded status into --failed, which is what triggers the full
                # diagnostics dump before the stack goes away.
                - name: workflow-status
                  value: '{{workflow.status}}'
