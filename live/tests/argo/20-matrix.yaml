# The orchestrator: what cron, a PR trigger, or a human submits.
#
# It fans out over configs and submits one CHILD WORKFLOW each, rather than looping configs
# inside a single workflow. That costs a little machinery (a resource template and the RBAC
# below) and buys the thing the whole migration is for: each config gets its own UI, its own
# retry budget, its own resume scope and its own teardown exit handler, so "re-run just
# `full`" is resubmitting one child and the other configs are untouched.
#
# Submit:
#   argo submit -n argo --from workflowtemplate/harness-matrix \
#     -p configs='["min_default"]' -p to-ref=<sha>
---
# The workflow service account can run pods but cannot create Workflows; the argo-workflows
# chart's workflow RBAC does not cover that. Without this the fan-out fails with a
# forbidden error on the first child.
#
# Everything here stays on the shared argo-workflow SA on purpose. A dedicated matrix
# SA was designed and rejected: the argo-privilege-gate admission policy
# (infra-tf/modules/argo-ops-cluster/admission.tf) forbids any template from naming a
# ServiceAccount other than argo-workflow/the restricted default - fine while the gate
# warns, a template that can never re-apply once it enforces - and EKS Pod Identity is
# associated with argo-workflow only, so a new SA's post-status pod would fail its
# vault login silently and leave the PR status pending forever. Isolating the write
# verbs from the Terraform-running phase pods is still worth doing, but it takes an
# infra-tf change (admission allowlist + pod identity association) applied in lockstep,
# not a unilateral SA swap here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harness-submit-children
  namespace: argo
rules:
  - apiGroups: ['argoproj.io']
    resources: ['workflows']
    # get/list/watch are what the resource template polls with to decide the child's
    # outcome; without them it can create a child and then never learn it finished.
    # The janitor cron (50-janitor-cron.yaml) also runs as argo-workflow and depends
    # on this same get/list for its ownership listing - removing reads here sends the
    # janitor dark, not loudly.
    # patch is what the supersede step uses to set shutdown: Stop on older runs for
    # the same PR; it grants no delete, so history is never removable this way.
    verbs: ['create', 'get', 'list', 'watch', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harness-submit-children
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harness-submit-children
subjects:
  - kind: ServiceAccount
    name: argo-workflow
    namespace: argo
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: harness-matrix
  namespace: argo
spec:
  entrypoint: matrix
  serviceAccountName: argo-workflow
  # The matrix blocks on its children (successCondition below), so the exit handler
  # sees the aggregate verdict: commit status back to the PR when pr-sha is set, and a
  # Slack post either way. Both the cron and PR entry points get this for free.
  onExit: notify
  # The submit-child pod is the parent's only watch on its child, it cannot be retried
  # (a retry would create a duplicate child), and Karpenter consolidation killed it once
  # mid-run, failing the parent while the child ran on. Keep the disruptor away from
  # every pod of this workflow.
  podMetadata:
    annotations:
      karpenter.sh/do-not-disrupt: 'true'
  arguments:
    parameters:
      # A JSON array, because withParam consumes JSON. A PR run usually wants just
      # ["min_default"]; the nightly wants the full set.
      - name: configs
        value: '["min_default","bi_ha","full"]'
      - name: scenario
        value: upgrade
      - name: from-ref
        value: 'auto:latest-1'
      # On a PR this is the head SHA: the staged release is what wants testing.
      - name: to-ref
        value: 'auto:latest'
      # Which ref the harness itself runs FROM, as opposed to the refs under test.
      - name: repo-ref
        value: master
      - name: keep-on-failure
        value: 'false'
      # Set by the PR trigger; empty on cron/manual runs, which skips the commit-status
      # post and only sends Slack.
      - name: pr-repo
        value: ''
      - name: pr-sha
        value: ''
      - name: vault-addr
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: vault_addr
      - name: slack-channel
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: slack_channel
      - name: image
        valueFrom:
          configMapKeyRef:
            name: harness-config
            key: image

  # No semaphore here on purpose. The orchestrator holds no stack, so gating it would
  # serialise submission while the real contention is on the children, which each take the
  # harness-semaphore themselves. Gating both would deadlock a matrix larger than the
  # semaphore.
  ttlStrategy:
    secondsAfterSuccess: 86400
    secondsAfterFailure: 259200

  templates:
    - name: matrix
      steps:
        - - name: supersede
            template: supersede-older
            # The script body is fail-open, but pod-level failures (deadline kill on
            # a hung API call, image pull, eviction) are outside its reach - without
            # continueOn any of those would fail this step, halt the step-group, and
            # leave the PR with no harness run plus a false failure status. This
            # step must be incapable of harming the run it precedes.
            continueOn:
              failed: true
              error: true
        - - name: scenario
            template: submit-child
            # Every config in parallel. The children queue on the semaphore, so this does
            # not overshoot the VPC quota; it just means the queue is Argo's problem
            # rather than a human's.
            withParam: '{{workflow.parameters.configs}}'
            arguments:
              parameters:
                - name: config
                  value: '{{item}}'

    # Stop superseded runs for the same PR before this one takes any capacity. A
    # release-please force-push resubmits the matrix while the previous submission may
    # be mid-provision, and its children then hold the harness semaphore for hours
    # testing a sha that is no longer the PR head. The children's staleness gate only
    # protects QUEUED runs (it fires at admission); anything already past it runs to
    # completion. This closes that gap: stop every OLDER matrix sharing this name
    # prefix (harness-pr<N>-) plus its children.
    #
    # Stop, never terminate: Stop still runs the scenario's teardown exit handler, and
    # the workflow-level semaphore is held until the whole workflow (teardown included)
    # finishes, so a superseded stack is fully destroyed before a waiting child can
    # take its slot. Per-run state isolation (run-id = workflow name) means an apply
    # interrupted by the Stop can only ever affect its own stack, and the orphan
    # janitor remains the backstop if a destroy fails. Best-effort by design: every
    # failure path exits 0, because correctness never depends on this step - it only
    # reclaims capacity earlier than the runs would release it themselves.
    - name: supersede-older
      # 300, not 120: the observed worst case is five stale matrices (PR #456), and the
      # bounded sweep's ceiling is 3 attempts x (N parents x 10s request timeout) + two
      # 5s sleeps - already past 120s at N=5 with a slow API server. continueOn keeps a
      # deadline kill from failing the run, but the kill leaves children unstopped with
      # no retry, so the budget errs long instead.
      activeDeadlineSeconds: 300
      script:
        image: '{{workflow.parameters.image}}'
        command: [/bin/bash]
        # Parameters arrive via env, never by textual substitution into the shell
        # source: a value carrying a quote in a direct template submission (the GH
        # path regex-validates, direct submits do not) cannot break out of quoting.
        env:
          - name: SELF
            value: '{{workflow.name}}'
          - name: PR_SHA
            value: '{{workflow.parameters.pr-sha}}'
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 128Mi }
        source: |
          set -uo pipefail
          KC="kubectl -n argo --request-timeout=10s"
          if [ -z "$PR_SHA" ]; then
            echo "not a PR run; nothing to supersede"; exit 0
          fi
          # Identity is contractual, not conventional: the name must be the GH
          # submitter's shape AND the harness/pr label must be present, or nothing
          # is selected. No name-prefix parsing.
          if ! [[ "$SELF" =~ ^harness-pr[0-9]+-[^-]+$ ]]; then
            echo "name '$SELF' is not harness-pr<N>-<suffix>; skipping supersede"; exit 0
          fi
          ME=$($KC get workflow "$SELF" -o json) || { echo "cannot read own workflow"; exit 0; }
          PR_NUM=$(jq -r '.metadata.labels."harness/pr" // empty' <<<"$ME")
          SELF_TS=$(jq -r '.metadata.creationTimestamp // empty' <<<"$ME")
          if [ -z "$PR_NUM" ] || [ -z "$SELF_TS" ]; then
            echo "own harness/pr label or timestamp missing; skipping supersede"; exit 0
          fi
          # Older same-PR matrices in ANY phase: a Failed parent can still own
          # running children, so the child sweep below must see it. Timestamp ties
          # are left alone on purpose - generateName suffixes do not encode
          # creation order, so any name tiebreak could stop the NEWER run.
          STALE=$($KC get workflows -l "harness/trigger=pr,harness/pr=${PR_NUM}" -o json \
            | jq -r --arg self "$SELF" --arg ts "$SELF_TS" \
              '.items[]
               | select(.metadata.name != $self)
               | select(.metadata.creationTimestamp < $ts)
               | .metadata.name') || { echo "cannot list matrices"; exit 0; }
          if [ -z "$STALE" ]; then
            echo "no older matrix for pr ${PR_NUM}"; exit 0
          fi
          # One atomic PATCH sets the superseded marker AND the graceful stop, so
          # the notify exit handler can never observe the stop without the marker
          # (post-status suppresses its failure noise on that label).
          MARK='{"metadata":{"labels":{"harness/superseded":"true"}},"spec":{"shutdown":"Stop"}}'
          # Parents FIRST: quiesce child scheduling before sweeping, else a child
          # created after our listing could linger unseen. Stop on a terminal
          # parent is a no-op; the marker still lands for its notify handler.
          while IFS= read -r wf; do
            [ -z "$wf" ] && continue
            echo "superseding ${wf}"
            $KC patch workflow "$wf" --type merge -p "$MARK" \
              || echo "warn: failed to patch parent ${wf}"
          done <<< "$STALE"
          # Bounded child sweep: children are ownerless by design, so stop them
          # directly; the later passes catch ones created in the window before their
          # parent quiesced. All three passes ALWAYS run - an empty listing is not
          # proof of quiescence, it is exactly what a submit-child pod mid-create
          # looks like, so breaking on empty would strand precisely the late child
          # the extra passes exist for. Only children not already shutting down are
          # patched - a stopped child stays Running through its teardown and must
          # not be re-patched every pass.
          for attempt in 1 2 3; do
            while IFS= read -r wf; do
              [ -z "$wf" ] && continue
              CHILDREN=$($KC get workflows -l "harness/parent=${wf}" -o json \
                | jq -r '.items[]
                         | select((.status.phase // "Pending") | IN("Pending", "Running"))
                         | select(.spec.shutdown == null)
                         | .metadata.name') || { echo "warn: cannot list children of ${wf}"; continue; }
              while IFS= read -r child; do
                [ -z "$child" ] && continue
                echo "  stopping child ${child} (attempt ${attempt})"
                $KC patch workflow "$child" --type merge -p "$MARK" \
                  || echo "warn: failed to patch child ${child}"
              done <<< "$CHILDREN"
            done <<< "$STALE"
            [ "$attempt" -lt 3 ] && sleep 5
          done
          exit 0

    - name: submit-child
      inputs:
        parameters:
          - name: config
      resource:
        action: create
        # Deliberately NOT setting an owner reference. Owner refs would cascade-delete the
        # children when this orchestrator hits its TTL, taking their history and pod logs
        # with it. The children carry their own ttlStrategy from harness-scenario, so they
        # age out on their own schedule and stay inspectable after the parent is gone.
        setOwnerReference: false
        successCondition: status.phase == Succeeded
        failureCondition: status.phase in (Failed, Error)
        manifest: |
          apiVersion: argoproj.io/v1alpha1
          kind: Workflow
          metadata:
            # Config names carry underscores (min_default, bi_ha), which RFC 1123 names
            # reject, so swap them out here. The harness/config label keeps the real name.
            generateName: harness-{{=sprig.replace('_', '-', inputs.parameters.config)}}-
            labels:
              harness/config: '{{inputs.parameters.config}}'
              harness/scenario: '{{workflow.parameters.scenario}}'
              harness/parent: '{{workflow.name}}'
          spec:
            workflowTemplateRef:
              name: harness-scenario
            arguments:
              parameters:
                - name: config
                  value: '{{inputs.parameters.config}}'
                - name: scenario
                  value: '{{workflow.parameters.scenario}}'
                - name: from-ref
                  value: '{{workflow.parameters.from-ref}}'
                - name: to-ref
                  value: '{{workflow.parameters.to-ref}}'
                - name: repo-ref
                  value: '{{workflow.parameters.repo-ref}}'
                - name: keep-on-failure
                  value: '{{workflow.parameters.keep-on-failure}}'
                # For the child's staleness gate: a queued child checks at admission
                # whether pr-sha is still the PR head and skips itself if superseded.
                - name: pr-repo
                  value: '{{workflow.parameters.pr-repo}}'
                - name: pr-sha
                  value: '{{workflow.parameters.pr-sha}}'

    - name: notify
      steps:
        - - name: post
            template: post-status

    # Posts the aggregate outcome. Runs on the harness image because it already has
    # bash/curl/jq and the vault CLI, and its pod identity is already a Vault deployer.
    # Notification failure must not fail the workflow record: the run's verdict is the
    # children's, not the messenger's - hence every failure path here exits 0.
    - name: post-status
      activeDeadlineSeconds: 300
      container:
        image: '{{workflow.parameters.image}}'
        command: ['/bin/bash', '-c']
        args:
          - |
            set -uo pipefail
            # A superseded run (stopped by a newer submission for the same PR) must
            # not post its red verdict anywhere: not a status on its old sha, not a
            # PR comment, not Slack. The marker label rides the SAME atomic PATCH as
            # the stop, so it is always visible by the time this handler runs. A
            # stopped workflow renders phase Failed ("Stopped with strategy 'Stop'"),
            # so the label - not the phase - is the only reliable discriminator.
            SUPERSEDED=$(kubectl -n argo --request-timeout=10s get workflow '{{workflow.name}}' -o json 2>/dev/null \
              | jq -r '.metadata.labels."harness/superseded" // empty')
            if [ "$SUPERSEDED" = "true" ]; then
              echo "superseded run; skipping status, comment and slack"; exit 0
            fi
            export VAULT_ADDR='{{workflow.parameters.vault-addr}}'
            export AWS_REGION=us-east-1
            vault login -method=aws role=deployer region=us-east-1 >/dev/null || { echo "vault login failed"; exit 0; }
            GH_TOKEN="$(vault kv get -field=github_token secret/dozuki/global/harness-notify 2>/dev/null)"
            SLACK_TOKEN="$(vault kv get -field=botToken secret/dozuki/global/slack 2>/dev/null)"
            # Channel comes from harness-config (deploy-pipeline channel); the shared
            # Vault channelId is only the fallback so a missing configmap key does not
            # silence the notification entirely.
            SLACK_CHANNEL='{{workflow.parameters.slack-channel}}'
            [ -z "$SLACK_CHANNEL" ] && SLACK_CHANNEL="$(vault kv get -field=channelId secret/dozuki/global/slack 2>/dev/null)"

            STATUS='{{workflow.status}}'
            [ "$STATUS" = Succeeded ] && GH_STATE=success || GH_STATE=failure
            [ "$STATUS" = Succeeded ] && EMOJI=':white_check_mark:' || EMOJI=':x:'
            DUR='{{workflow.duration}}'; DUR="${DUR%%.*}"
            case "$DUR" in ''|*[!0-9]*) DUR=0;; esac
            DUR_H="$((DUR/60))m$(printf '%02d' $((DUR%60)))s"

            DESC="harness {{workflow.name}}: ${STATUS} (configs {{workflow.parameters.configs}}, to-ref {{workflow.parameters.to-ref}})"

            # Child detail, gathered once and shared by the PR comment and the Slack
            # post. For each child: config, phase, the plain Argo node summary
            # (detail), and - when `harness evidence` is present in the image and a
            # log fetch succeeds - the actual proximate tofu/terragrunt/helm error
            # pulled from that node's archived container log (log_excerpt). The
            # renderer prefers log_excerpt and falls back to detail, so a stale image
            # (missing the evidence subcommand) or an S3 hiccup just means the card
            # reads today's node summary instead of the extracted error - never
            # nothing.
            WF_JSON=$(kubectl -n argo get workflows -l 'harness/parent={{workflow.name}}' -o json 2>/dev/null)
            CHILD_JSON=$(printf '%s' "$WF_JSON" | timeout 60 harness evidence --region us-east-1 2>/dev/null)
            # Fall back to the plain jq summary on anything that isn't usable JSON -
            # empty output, a literal "null", or a truncated/malformed body (a killed
            # `harness evidence` process can leave a partial write behind).
            if [ -z "$CHILD_JSON" ] || [ "$CHILD_JSON" = "null" ] || ! printf '%s' "$CHILD_JSON" | jq -e . >/dev/null 2>&1; then
              CHILD_JSON=$(printf '%s' "$WF_JSON" | jq '[.items[] | {
                    name: .metadata.name,
                    config: (.metadata.labels["harness/config"] // "-"),
                    phase: (.status.phase // "-"),
                    msg: (.status.message // ""),
                    detail: ([.status.nodes // {} | .[] | select(.phase == "Failed" or .phase == "Error")
                              | select(.type == "Pod") | "\(.displayName): \(.message // "")"] | join("; "))
                  }]' 2>/dev/null) || CHILD_JSON='[]'
            fi
            [ -z "$CHILD_JSON" ] && CHILD_JSON='[]'

            if [ -n '{{workflow.parameters.pr-sha}}' ] && [ -n "$GH_TOKEN" ]; then
              curl -sf -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/{{workflow.parameters.pr-repo}}/statuses/{{workflow.parameters.pr-sha}}" \
                -d "{\"state\":\"${GH_STATE}\",\"context\":\"harness/upgrade-tests\",\"description\":\"${DESC:0:130}\"}" \
                >/dev/null || echo "github status post failed"

              # Also leave a run report on the PR thread. The status above is the merge
              # gate; the comment is the human-readable history (it survives label
              # re-runs, one comment per run). PR number comes from the head SHA.
              PR_NUM=$(curl -sf \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/{{workflow.parameters.pr-repo}}/commits/{{workflow.parameters.pr-sha}}/pulls" \
                | jq -r '.[0].number // empty') || PR_NUM=""
              if [ -n "$PR_NUM" ]; then
                CHILDREN=$(printf '%s' "$CHILD_JSON" | jq -r '.[] | "| `\(.name)` | \(.config) | \(.phase) | \((.log_excerpt // "") | if . != "" then . else (if .detail != "" then .detail else .msg end) end) |"')
                [ -z "$CHILDREN" ] && CHILDREN='| _no child workflows_ |  |  |  |'
                BODY=$(printf '### Upgrade harness: %s %s\n\nWorkflow `%s` finished in %s.\n\n- configs `%s`, scenario `%s`\n- from `%s` to `%s`\n\n| child workflow | config | phase | detail |\n|---|---|---|---|\n%s\n' \
                  "$EMOJI" "$STATUS" '{{workflow.name}}' "$DUR_H" \
                  '{{workflow.parameters.configs}}' '{{workflow.parameters.scenario}}' \
                  '{{workflow.parameters.from-ref}}' '{{workflow.parameters.to-ref}}' "$CHILDREN")
                jq -n --arg body "$BODY" '{body: $body}' \
                  | curl -sf -X POST \
                      -H "Authorization: Bearer ${GH_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/{{workflow.parameters.pr-repo}}/issues/${PR_NUM}/comments" \
                      -d @- >/dev/null || echo "github comment post failed"
              else
                echo "no open PR found for the sha; comment skipped"
              fi
            fi

            # Verdict card goes through the fleet relay (the same renderer that draws
            # the Flux and Alertmanager cards), keeping one alert design. The direct
            # bot-token post survives only as the fallback so a relay outage still
            # produces a (plain) notification.
            RELAY_URL="$(vault kv get -field=url secret/dozuki/global/alertmanager-slack-relay-endpoint 2>/dev/null)"
            RELAY_TOKEN="$(vault kv get -field=token secret/dozuki/global/alertmanager-slack-relay 2>/dev/null)"
            TRIGGER=$(printf '%s' '{{workflow.name}}' | sed -n 's/^harness-\(pr[0-9]*\)-.*/\1/p')
            if [ -z "$TRIGGER" ]; then
              case '{{workflow.name}}' in *nightly*) TRIGGER=nightly;; *) TRIGGER=manual;; esac
            fi
            PR_URL=""
            [ -n "${PR_NUM:-}" ] && PR_URL="https://github.com/{{workflow.parameters.pr-repo}}/pull/${PR_NUM}"
            RELAY_PAYLOAD=$(printf '%s' "$CHILD_JSON" | jq \
              --arg name '{{workflow.name}}' \
              --arg status "$STATUS" \
              --arg scenario '{{workflow.parameters.scenario}}' \
              --arg configs '{{workflow.parameters.configs}}' \
              --arg fromref '{{workflow.parameters.from-ref}}' \
              --arg toref '{{workflow.parameters.to-ref}}' \
              --arg trigger "$TRIGGER" \
              --arg prurl "$PR_URL" \
              --argjson dur "$DUR" \
              '{
                source: "harness", name: $name, status: $status,
                scenario: $scenario, configs: $configs,
                from_ref: $fromref, to_ref: ($toref | .[0:64]),
                duration_seconds: $dur, trigger: $trigger, pr_url: $prurl,
                children: (map({config: .config, phase: .phase,
                                detail: (if .detail != "" then .detail else .msg end | .[0:400]),
                                log_excerpt: (.log_excerpt // "" | .[0:460])}))
              }')
            if [ -n "$RELAY_URL" ] && [ -n "$RELAY_TOKEN" ] && \
               printf '%s' "$RELAY_PAYLOAD" | curl -sf -X POST \
                 -H "Authorization: Bearer ${RELAY_TOKEN}" \
                 -H 'Content-type: application/json' \
                 --data @- "$RELAY_URL" >/dev/null; then
              echo "verdict posted via relay"
            elif [ -n "$SLACK_TOKEN" ] && [ -n "$SLACK_CHANNEL" ]; then
              echo "relay unavailable; falling back to a plain post"
              curl -sf -X POST -H 'Content-type: application/json; charset=utf-8' \
                -H "Authorization: Bearer ${SLACK_TOKEN}" \
                --data "{\"channel\":\"${SLACK_CHANNEL}\",\"text\":\"${EMOJI} ${DESC}\"}" \
                https://slack.com/api/chat.postMessage >/dev/null || echo "slack post failed"
            fi
            exit 0
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { memory: 256Mi }
