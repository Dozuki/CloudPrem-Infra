# Nightly upgrade matrix. All knobs live on harness-matrix; this is only the clock.
#
# Timing: 4 configs x ~2h with the harness-semaphore at 2 is two waves; bi_ha and full are
# still the long poles (slim_upgrade is min-shaped), so the finish stays around
# 06:00-07:00 ET. The children gate on the semaphore themselves (NEVER add a semaphore here
# or at the matrix level: parent+child gating deadlocks any matrix larger than the
# semaphore). Forbid means a still-running night blocks the next - the semaphore would
# serialise them anyway, without the visibility.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: harness-nightly
  namespace: argo
spec:
  # v4 renamed the singular `schedule` away, same as synchronization.semaphore(s).
  schedules:
    - '0 2 * * *'
  timezone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  workflowMetadata:
    labels:
      harness/trigger: cron
  workflowSpec:
    workflowTemplateRef:
      name: harness-matrix
