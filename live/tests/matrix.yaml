# Test matrix for the upgrade harness. The harness resolves from_ref/to_ref,
# looks up each ref's version profile, merges it with a config's feature flags,
# and writes the result as env.hcl into each worktree before applying.
defaults:
  from_ref: "auto:latest-1"   # second-newest git tag
  to_ref: "auto:latest"       # newest git tag; override to a branch (e.g. v6.1-release) pre-tag
  region: "us-east-1"
  dr_region: "us-west-2"
  env_path: "live/standard/us-east-1"   # parent dir holding region.hcl; the config's env dir is <env_path>/<env>
  reaper_ttl_hours: 24   # resources get deleteAfter = run start + this; the reaper purges them after, if teardown failed

# Default version vars applied to EVERY ref (image_tag, chart_version, …). A ref
# only needs an entry under `versions:` below if it DIFFERS from these. A freshly
# tagged release that uses the current images + chart (the common case) needs NO
# entry — `auto:latest` and any new vX.Y.Z inherit these. Update when the current
# release's images/chart change. (Undeclared TF_VAR_* are ignored by Terraform,
# so a superset of keys is safe on older refs that don't declare them.)
version_defaults:
  image_tag: "3625f3c7a3fe9bd3fb87b03a23a4cbb683d44ded.11"   # what mpc-dev-min-logical runs; .8 was three builds stale
  nextjs_tag: "2.23.0"
  chart_version: "2.10.0"  # Track the CURRENT chart so a run validates the pairing a real deploy
                           # would get. This sits ahead of the fleet (2.8.x today) on purpose: the
                           # harness exists to find a bad pairing before an env does, so it tracks
                           # the newest published chart rather than the one already rolled out.
                           #
                           # HARD FLOOR 2.7.2 as of CPI v8.14.0. v8.14.0 carries #441
                           # (3d619d5), which drops vault_kv_secret_v2.smtp via
                           # removed{destroy=false}. That leaves an EXISTING env's Vault value
                           # alone but never creates one for a NEW env, and a chart below 2.7.2
                           # reads that path with bare dot access, so the whole
                           # dozuki-infra-credentials ExternalSecret aborts (db_host, db_user,
                           # cache, sentry, not just smtp), app pods never start, and Envoy
                           # answers 503 forever while terraform reports success. helm #221
                           # (50a6ab8, first in chart-v2.7.2) tolerates the absent path. Being
                           # pinned at 2.6.0 is what made every v8.14.0 provision fail.
                           #
                           # Earlier floors, same shape: 2.6.0 for CPI >= 8.12 (grafana_primary DB
                           # bootstrap moved from bi.tf to the chart's grafana-db-init hook, and
                           # the dashboards Grafana password became chart-rendered); 1.18.0 /
                           # v7.17.0 (NLB TGBs #278, frontegg DB-create + ztunnel PodMonitor #277).
                           # Hook templates are gated on values only newer CPI passes, so this
                           # chart stays safe on older baseline refs. Bump this when the chart
                           # releases, or the harness quietly tests a pairing nobody runs.
  image_repository: "069174876992.dkr.ecr.us-east-1.amazonaws.com"

# Per-ref OVERRIDES — only keys that DIFFER from version_defaults need to be here.
# The v6.0.x baselines predate the OCI chart; they inherit chart_version 0.4.1
# from the defaults (harmless: their logical layer doesn't declare it).
versions:
  v6.0:
    image_tag: "3625f3c7a3fe9bd3fb87b03a23a4cbb683d44ded.4"
    nextjs_tag: "2.23.0"
    image_repository: "069174876992.dkr.ecr.us-east-1.amazonaws.com"   # required by v6.0 logical (no default)
  v6.0.1:                                                              # v6.0 + manual-TLS restore (self-signing baseline); same app images as v6.0
    image_tag: "3625f3c7a3fe9bd3fb87b03a23a4cbb683d44ded.4"
    nextjs_tag: "2.23.0"
    image_repository: "069174876992.dkr.ecr.us-east-1.amazonaws.com"
  v6.0.2:                                                              # v6.0.1 + KMS 7-day dev deletion window. Same app images.
    image_tag: "3625f3c7a3fe9bd3fb87b03a23a4cbb683d44ded.4"
    nextjs_tag: "2.23.0"
    image_repository: "069174876992.dkr.ecr.us-east-1.amazonaws.com"
  v6.0.3:                                                              # v6.0.2 + chart TLS-secret kubernetes.io/tls fix (serves HTTPS over Envoy Gateway). PREFERRED baseline. Same app images.
    image_tag: "3625f3c7a3fe9bd3fb87b03a23a4cbb683d44ded.4"
    nextjs_tag: "2.23.0"
    image_repository: "069174876992.dkr.ecr.us-east-1.amazonaws.com"
  v6.1-release:
    image_tag: "3625f3c7a3fe9bd3fb87b03a23a4cbb683d44ded.4"
    nextjs_tag: "2.23.0"
    chart_version: "0.4.1"   # 0.4.0 MPC gateway edge (#55) + configurable app-tier securityContext (#56); 0.3.12 typed tls-secret (#54)
    image_repository: "069174876992.dkr.ecr.us-east-1.amazonaws.com"   # e.g. <acct>.dkr.ecr.us-east-1.amazonaws.com
  v8.3.0:
    # The chart the fleet actually pairs with v8.3.0 (mpc-dev-min and a commercial env). Pinning it
    # here makes the upgrade run exercise the REAL transition - CPI 8.3.0/chart 2.2.0 ->
    # CPI 8.3.1/chart 2.2.2 - instead of holding the chart still across the bump. It also
    # keeps the baseline honest: chart 2.2.1 consumes an ops basic-auth value that only
    # CPI >= 8.3.1 passes (helm #189 / CPI #377 are the two halves of one change), so
    # 2.2.0 is the newest chart a v8.3.0 stack should be built on. Same image_tag on both
    # sides, so the chart is the only thing that moves.
    chart_version: "2.2.0"

configs:
  # PR scenario gating (.github/workflows/upgrade-tests.yml, "Select PR scenarios" step) reads
  # the `paths:` list below per scenario: a scenario runs on a PR only if the relevant diff
  # touches one of its globs. A config with NO `paths:` key (min_default) always runs - that is
  # the baseline every PR pays for, and it is why a new scenario added without a paths list
  # runs everywhere until someone writes one. This list is the single source of truth for
  # "what counts as BI"; keep it in sync with what bi_ha's feature flags actually turn on.
  # The gate also has two escapes that ignore this list entirely: any PR touching live/tests/**
  # or the workflow file itself runs every PR scenario (a harness change has to prove the whole
  # matrix still works), and the `harness-full` PR label forces the same. The workflow step's
  # own comments carry the rest of the rule, including the diff basis per PR type.
  - name: min_default
    env: min
    feature_flags:
      enable_bi: false
      db_engine: aurora              # Aurora Serverless v2 — the new-stack default; rds_* sizing flags are ignored on aurora
      rds_multi_az: false
      highly_available_nat_gateway: false
      protect_resources: false
      enable_dr: false               # Plan 2: DR off; Plan 3 turns it on
      # Pinned because this is the UPGRADE scenario and its baseline is provisioned from an
      # older ref. The database CMK used to be gated on enable_dr, so a baseline built with
      # DR off landed on alias/aws/rds; the CMK is now unconditional, and the KMS key is
      # immutable on Aurora, so leaving this unset would change kms_key_id between baseline
      # and upgrade and REPLACE the cluster. With protect_resources: false there is no
      # deletion protection and no Spacelift db-replace-guard here, so nothing would stop it -
      # the run would quietly stop testing an in-place upgrade.
      #
      # false is also what every pre-existing production stack pins, so this mirrors the real
      # upgrade path rather than inventing one. Coverage for the NEW default comes from the
      # `recover` config, which provisions fresh with DR off and takes the CMK.
      rds_adopt_dr_cmk: false
      alarm_email: "devops@dozuki.com"
      # Vault is mandatory in the physical/logical layers (no disable flag).
      # Mirror the _mcp/dev (DDVtest) env: shared standard Vault
      # PrivateLink service + address. DDVtest must be an allowed principal on
      # the service and Vault must hold this stack's secrets to converge.
      customer: "smoke"              # unique identity (smoke-min) — avoids the live dev-min/dozuki-min; logical self-seeds its Vault secrets
      enable_vault: true
      vault_endpoint_service_name: "com.amazonaws.vpce.us-east-1.vpce-svc-0d7e9dff014f28174"
      vault_address: "http://vault.internal.dozuki.com:8200"
      managed_private_cloud: true
      # Every config sets this. A smoke stack is a real AWS stack, so it inherits the
      # fleet Slack route and pages the shared channel like a customer env would - and
      # small clusters trip node-capacity alerts (KubeCPUOvercommitCluster) by design.
      # Worse, teardown deletes Alertmanager along with the cluster, so the resolved
      # notification never sends and the firing message outlives the stack it describes.
      alertmanager_slack_enabled: false
      # sso_admin_role_arn intentionally unset: when the harness runs AS the SSO
      # admin role (local runs), that identity IS the EKS cluster creator, so an
      # explicit access entry for it collides with the auto-created creator entry
      # (ResourceInUseException). The creator already has cluster admin, so the
      # harness needs no explicit entry; leaving it unset works for local + CI.
  - name: bi_ha
    env: bi
    # What this scenario actually exercises: DMS Serverless replication (physical/bi.tf),
    # the BI target database on either engine path (aws_db_instance dms_replica_database /
    # module.bi_aurora) and its parameter groups, the bi_* variables that steer them, the
    # logical-layer dms-start Job, and the bi/ env dirs the scenario's `env: bi` resolves to.
    #
    # The test for a file belonging here is not "is it named bi": it is "can breaking this
    # be invisible to min_default". min_default runs with enable_bi false, so everything
    # gated on enable_bi/dms_enabled is only ever proven by this scenario, including the
    # physical outputs that hand DMS to the logical layer, the logical locals and Vault
    # write that consume them, and the DMS IAM the dms-start Job assumes.
    #
    # variables.tf/main.tf/monitoring.tf/db.tf/eks.tf/aurora.tf/outputs.tf and the logical
    # main.tf/vault.tf/flux.tf are shared files (not BI-only), so a change anywhere in them
    # over-triggers this scenario rather than risk missing a real bi_* toggle edit - cheap
    # insurance, since the alternative is finding out on the release PR.
    paths:
      - "terraform/physical/bi.tf"
      # rds.tf carries the BI database security group and the RDS
      # parameter-group/replica path this scenario's older baseline runs on;
      # min_default is aurora-only and never exercises them.
      - "terraform/physical/rds.tf"
      - "terraform/physical/static/dms_config.json"
      - "terraform/physical/static/dms_mapping.json"
      - "terraform/physical/util/dms_restart.py"
      - "terraform/physical/util/dms-stop.sh"
      - "terraform/physical/variables.tf"
      - "terraform/physical/main.tf"        # bi_uses_aurora + every bi_db_* local
      - "terraform/physical/monitoring.tf"  # DMS alarm wiring
      - "terraform/physical/outputs.tf"     # dms_task_arn, dms_replication_generation, bi_*
      - "terraform/physical/db.tf"          # locals the DMS source endpoint reads
      - "terraform/physical/eks.tf"         # dms:Start*/Describe* for the dms-start Job
      - "terraform/physical/aurora.tf"      # bi_uses_aurora shares its final-snapshot suffix
      - "terraform/logical/bi.tf"
      - "terraform/logical/variables.tf"
      - "terraform/logical/main.tf"         # db_bi_* locals + the BI credentials secret
      - "terraform/logical/vault.tf"        # the BI database credentials write
      - "terraform/logical/flux.tf"         # grafanaDbInit + the enable_bi precondition
      - "live/.skel/environments/bi/**"
      - "live/*/*/bi/**"
    feature_flags:
      enable_bi: true
      db_engine: aurora
      rds_multi_az: true
      enable_dr: true
      rds_adopt_dr_cmk: true     # RDS-only (DR backup replication); ignored on aurora
      # This config used to build no BI database at all: rds_replica_database needs
      # db_engine == "rds" and everything else needs dms_enabled, so enable_bi on its own
      # bought a KMS key and a secret. These two flags make it the Aurora BI path -
      # DMS Serverless replicating into an Aurora Serverless v2 cluster - which is what new
      # stacks get and what nothing in the harness exercised. `full` keeps bi_db_engine at
      # the "rds" default, so the provisioned path every existing stack is still on stays
      # covered too.
      #
      # In the UPGRADE scenario the baseline ref predates bi_db_engine, so the baseline
      # builds the provisioned pair (replication task + RDS replica) and the upgrade
      # performs the real migration: task -> replication config, RDS replica -> Aurora.
      # That works unattended only because protect_resources is false here; a stack with
      # deletion protection on needs the out-of-band pre-step in the bi_db_engine docs.
      bi_dms_enabled: true
      bi_db_engine: aurora
      alarm_email: "devops@dozuki.com"
      # Same wiring min_default and full carry. WriteEnvHCL REPLACES env.hcl outright
      # rather than merging into the .skel, so anything omitted here silently falls back
      # to the terraform default - it is not inherited from the skel. That is how this
      # config ended up unrunnable: vault_endpoint_service_name (physical) and
      # vault_address (logical) are required with no default, and protect_resources
      # defaults to TRUE, which turns on RDS deletion protection + skip_final_snapshot
      # and makes the stack impossible to tear down.
      protect_resources: false
      customer: "smoke"
      enable_vault: true
      vault_endpoint_service_name: "com.amazonaws.vpce.us-east-1.vpce-svc-0d7e9dff014f28174"
      vault_address: "http://vault.internal.dozuki.com:8200"
      managed_private_cloud: true
      alertmanager_slack_enabled: false
  # Recovery scenario (TestRecover / RunRecovery): recover_source is the "lost" stack
  # (DR on, drill on, BI off to keep the ~4h wall clock down); recover is the DR-REGION
  # rebuild stood up from the promoted cluster's snapshot + the adopted *-dr-* buckets.
  # The rebuild's seeded inputs (aurora_snapshot_identifier, s3_existing_buckets,
  # s3_kms_key_id, enable_dr=false) are RUNTIME values injected by the harness via
  # ExtraInputs, not listed here. Distinct customers: identifiers must not collide
  # (IAM/cluster names are account-global) with each other or the smoke-* configs.
  - name: recover_source
    env: min
    feature_flags:
      enable_bi: false
      db_engine: aurora
      rds_multi_az: false
      highly_available_nat_gateway: false
      enable_dr: true
      restore_drill: true         # consumed by the harness, NOT passed to terraform
      protect_resources: false
      alarm_email: "devops@dozuki.com"
      customer: "smokesrc"
      enable_vault: true
      vault_endpoint_service_name: "com.amazonaws.vpce.us-east-1.vpce-svc-0d7e9dff014f28174"
      vault_address: "http://vault.internal.dozuki.com:8200"
      managed_private_cloud: true
      alertmanager_slack_enabled: false
  - name: recover
    env: min
    env_path: "live/standard/us-west-2"   # the DR region — this config IS the rebuild
    region: "us-west-2"
    feature_flags:
      enable_bi: false
      db_engine: aurora
      rds_multi_az: false
      highly_available_nat_gateway: false
      enable_dr: false            # the rebuilt stack IS the surviving copy; failback re-enables DR later
      protect_resources: false
      alarm_email: "devops@dozuki.com"
      customer: "smokerec"
      enable_vault: true
      # Same us-east-1 PrivateLink service, reached cross-region. vault.tf handles the
      # CONSUMER half (it sets service_region when the name's region differs), but the
      # PRODUCER half must opt in: this region has to appear in the service's
      # supported_regions or CreateVpcEndpoint returns InvalidServiceName. The first
      # drill died there; RunRecovery now preflights it before provisioning anything.
      # In a REAL us-east-1 loss the shared Vault is gone too — a known product-level
      # gap this scenario documents rather than hides (the drill exercises the rebuild
      # mechanics; Vault-region survivability is tracked in the failover design).
      vault_endpoint_service_name: "com.amazonaws.vpce.us-east-1.vpce-svc-0d7e9dff014f28174"
      vault_address: "http://vault.internal.dozuki.com:8200"
      managed_private_cloud: true
      alertmanager_slack_enabled: false
  - name: full
    env: full
    feature_flags:
      enable_bi: true
      db_engine: aurora
      rds_multi_az: true
      enable_dr: true
      rds_adopt_dr_cmk: true
      bi_dms_enabled: true
      # bi_db_engine intentionally left at its "rds" default: this is the provisioned BI
      # path the existing fleet runs. bi_ha covers the Aurora one.
      restore_drill: true         # consumed by the harness, NOT passed to terraform
      # Kept deliberately even though the variable no longer exists on the target ref.
      # This is the UPGRADE scenario: the baseline comes from an older ref (from_ref
      # auto:latest-1) that still declares istio_mesh_state and defaults it to
      # "disabled". Dropping this key would stand the baseline up with no mesh and
      # turn the test into "disabled -> strict" (a first-time mesh install) instead of
      # the "strict -> strict" no-op the fleet actually performs. The target ref
      # ignores it as an undeclared TF_VAR_*, so it only shapes the baseline half.
      # Drop this key once from_ref (auto:latest-1) has advanced past the release
      # that removed the variable, at which point the baseline no longer reads it.
      istio_mesh_state: "strict"
      alarm_email: "devops@dozuki.com"
      # MUST be false for an ephemeral test stack. The variable defaults to TRUE, which
      # turns on RDS deletion protection and skip_final_snapshot=false, so teardown dies
      # with "Cannot delete protected DB Instance" / "final_snapshot_identifier is
      # required" and strands the databases, VPC and subnet/param groups. Only
      # min_default set this, which is why it only ever surfaced on full.
      protect_resources: false
      # Same vault/identity wiring min_default carries. vault_endpoint_service_name
      # (physical) and vault_address (logical) are required variables with no default,
      # so without these the config cannot init. customer gives the stack a unique
      # identity (smoke-full) so it never collides with the live dev-min/dozuki-* stacks.
      customer: "smoke"
      enable_vault: true
      vault_endpoint_service_name: "com.amazonaws.vpce.us-east-1.vpce-svc-0d7e9dff014f28174"
      vault_address: "http://vault.internal.dozuki.com:8200"
      managed_private_cloud: true
      alertmanager_slack_enabled: false
  # slim_fresh / slim_upgrade carry no `paths:` key, but that does NOT mean they run on
  # every PR the way min_default does. Nightly-only for these two is enforced by the PR
  # workflow's hardcoded config set (.github/workflows/upgrade-tests.yml only ever submits
  # from a fixed list), not by this file's paths gate.
  - name: slim_fresh
    env: min
    feature_flags:
      enable_bi: false
      db_engine: aurora
      rds_multi_az: false
      highly_available_nat_gateway: false
      protect_resources: false
      enable_dr: false
      rds_adopt_dr_cmk: true        # greenfield: matches dev-slim and the new-stack default
      alarm_email: "devops@dozuki.com"
      customer: "smoke"
      enable_vault: true
      vault_endpoint_service_name: "com.amazonaws.vpce.us-east-1.vpce-svc-0d7e9dff014f28174"
      vault_address: "http://vault.internal.dozuki.com:8200"
      managed_private_cloud: true
      alertmanager_slack_enabled: false
    # Pins mirror infra-live standard/_mcp/dev/us-east-1/slim/env.hcl (dev-slim).
    # Update these when dev-slim's env.hcl moves.
    target_versions:
      app_image_flavor: "slim"
      chart_version: "3.1.1"
      image_tag: "0.0.0-05d4e70bd52-mpcfix5"
      beanstalkd_tag: "6f41576"
      nextjs_tag: "0.0.0-f28af33fdb7"
  - name: slim_upgrade
    env: min
    feature_flags:
      enable_bi: false
      db_engine: aurora
      rds_multi_az: false
      highly_available_nat_gateway: false
      protect_resources: false
      enable_dr: false
      rds_adopt_dr_cmk: false       # baseline is provisioned at an older ref; same CMK-immutability rationale as min_default
      alarm_email: "devops@dozuki.com"
      customer: "smoke"
      enable_vault: true
      vault_endpoint_service_name: "com.amazonaws.vpce.us-east-1.vpce-svc-0d7e9dff014f28174"
      vault_address: "http://vault.internal.dozuki.com:8200"
      managed_private_cloud: true
      alertmanager_slack_enabled: false
    # Baseline = legacy flavor from version_defaults (no baseline_versions needed).
    # Target flips to the slim set: the legacy->slim migration path, in place.
    target_versions:
      app_image_flavor: "slim"
      chart_version: "3.1.1"
      image_tag: "0.0.0-05d4e70bd52-mpcfix5"
      beanstalkd_tag: "6f41576"
      nextjs_tag: "0.0.0-f28af33fdb7"
  # Separates "the app image moved" from "the flavor flipped". slim_upgrade moves the flavor,
  # the chart AND every image tag at once, so when it fails there is no way to tell which of
  # those did it. This config holds everything still except image_tag: same legacy flavor both
  # sides, chart 2.10.0 pinned explicitly on BOTH sides (not inherited, so a version_defaults
  # bump cannot start moving the chart underneath it), same feature_flags as slim_upgrade.
  # A failure here is an app-version problem; a failure only in slim_upgrade is the flavor flip.
  #
  # Both tags are real legacy builds of the app image: .10 (2026-07-28) -> .11 (2026-07-29,
  # the newest clean legacy tag, and what version_defaults currently carries). The .12-tracing*
  # tags are experiment builds and are deliberately not used here.
  #
  # The slim_ name prefix is required plumbing, not a claim about the flavor: golden_test.go
  # excludes slim_-prefixed configs from goldenConfigs, and a config carrying
  # baseline_versions/target_versions cannot be in goldenConfigs. Runtime slim behavior keys off
  # the VALUES (app_image_flavor), which this config never sets, so it stays legacy on both sides.
  - name: slim_legacy_appbump
    env: min
    feature_flags:
      enable_bi: false
      db_engine: aurora
      rds_multi_az: false
      highly_available_nat_gateway: false
      protect_resources: false
      enable_dr: false
      rds_adopt_dr_cmk: false       # baseline is provisioned at an older ref; same CMK-immutability rationale as min_default
      alarm_email: "devops@dozuki.com"
      customer: "smoke"
      enable_vault: true
      vault_endpoint_service_name: "com.amazonaws.vpce.us-east-1.vpce-svc-0d7e9dff014f28174"
      vault_address: "http://vault.internal.dozuki.com:8200"
      managed_private_cloud: true
      alertmanager_slack_enabled: false
    baseline_versions:
      chart_version: "2.10.0"
      image_tag: "3625f3c7a3fe9bd3fb87b03a23a4cbb683d44ded.10"
    target_versions:
      chart_version: "2.10.0"
      image_tag: "3625f3c7a3fe9bd3fb87b03a23a4cbb683d44ded.11"
